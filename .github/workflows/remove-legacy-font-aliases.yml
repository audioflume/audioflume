name: Remove legacy font aliases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-legacy-font-aliases.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy font tokens
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              "--font-satoshi": "--font-aktiv-grotesk",
              "--font-instrument-sans": "--font-aktiv-grotesk",
              '"Satoshi"': '"aktiv-grotesk"',
              "'Satoshi'": "'aktiv-grotesk'",
              '"Instrument Sans"': '"aktiv-grotesk"',
              "'Instrument Sans'": "'aktiv-grotesk'",
          }

          excluded = {
              Path('.github/workflows/remove-legacy-font-aliases.yml'),
          }
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.pdf',
              '.woff', '.woff2', '.ttf', '.otf', '.mp3', '.wav', '.zip',
          }

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path in excluded or '.git' in path.parts:
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          workflow = Path('.github/workflows/remove-legacy-font-aliases.yml')
          workflow.unlink()

          print('Updated files:')
          for path in changed:
              print(path)

          remaining = []
          needles = ('font-satoshi', 'font-instrument-sans', 'Satoshi', 'Instrument Sans')
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if any(needle in text for needle in needles):
                  remaining.append(str(path))

          if remaining:
              raise SystemExit('Legacy font references remain: ' + ', '.join(remaining))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove Satoshi and Instrument font references"
          git push origin main
