name: Apply Discover search bar width

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-discover-searchbar-width.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Discover search bar
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/discover/discover-curated-hero-copy.css")
          content = path.read_text()

          replacements = {
              "width: min(calc(100% - 80px), 1080px);": "width: min(calc(100% - 80px), 800px);",
              "border: 1px solid rgba(255, 255, 255, 0.035);": "border: 0;",
          }

          for old, new in replacements.items():
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, found {count}")
              content = content.replace(old, new, 1)

          path.write_text(content)
          PY

      - name: Commit source change and remove workflow
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "filmwave-webmaster@users.noreply.github.com"
          git rm .github/workflows/apply-discover-searchbar-width.yml
          git add apps/web/app/discover/discover-curated-hero-copy.css
          git commit -m "Refine Discover search bar width"
          git push origin main
