name: Apply recent playlist component migration

on:
  push:
    branches:
      - agent/recent-playlist-migration
    paths:
      - .github/workflows/apply-recent-playlist-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recent-playlist-migration

      - name: Apply source-owned component migration
        run: |
          python <<'PY'
          from pathlib import Path

          curated_path = Path("apps/web/app/curated-playlists/CuratedJumpBackIn.tsx")
          curated = curated_path.read_text()
          old_render = '  const renderInline = inline && isDiscoverPage;'
          new_render = '  const renderInline = inline && isDiscoverPage && placement == "hero";'
          assert curated.count(old_render) == 1
          curated_path.write_text(curated.replace(old_render, new_render))

          community_path = Path("apps/web/app/community-playlists/page.tsx")
          community = community_path.read_text()

          import_anchor = 'import Footer from "@/components/Footer";\n'
          import_line = 'import RecentPlaylistCards from "@/components/RecentPlaylistCards";\n'
          assert community.count(import_anchor) == 1
          assert import_line not in community
          community = community.replace(import_anchor, import_anchor + import_line)

          old_styles = '''        .community-jump-back-list {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
          }

          .community-jump-back-item {
            min-width: 0;
            display: flex;
            min-height: 82px;
            align-items: center;
            gap: 12px;
            border-radius: 12px;
            background: var(--bg-secondary);
            padding: 9px;
            color: inherit;
            text-decoration: none;
            transition: background-color 150ms ease, transform 150ms ease;
          }

          .community-jump-back-item:hover,
          .community-jump-back-item:focus-visible {
            background: var(--bg-hover);
            transform: translateY(-1px);
            outline: none;
          }

          .community-jump-back-cover,
          .community-jump-back-placeholder {
            display: block;
            width: 64px;
            height: 64px;
            flex: 0 0 64px;
            border-radius: 10px;
            background: var(--bg-elevated);
            object-fit: cover;
          }

          .community-jump-back-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
          }

          .community-jump-back-copy strong,
          .community-jump-back-copy small {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .community-jump-back-copy strong {
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            line-height: 1.15;
          }

          .community-jump-back-copy small {
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.15;
          }

'''
          new_styles = '''        .community-jump-back .recent-playlist-card-list {
            margin-top: 16px;
          }

'''
          assert community.count(old_styles) == 1
          community = community.replace(old_styles, new_styles)

          responsive_blocks = [
              '''        @media (max-width: 1320px) {
            .community-jump-back-list {
              grid-template-columns: repeat(4, minmax(0, 1fr));
            }
          }

''',
              '''
            .community-jump-back-list {
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }
''',
              '''
            .community-jump-back-list {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
''',
              '''
          @media (max-width: 480px) {
            .community-jump-back-list {
              grid-template-columns: 1fr;
            }
          }
''',
          ]
          for block in responsive_blocks:
              assert community.count(block) == 1, block
              community = community.replace(block, "")

          old_markup = '''          {recentPlaylists.length > 0 && (
            <section className="community-jump-back" aria-labelledby="community-jump-back-heading">
              <h2
                className="community-jump-back-heading"
                id="community-jump-back-heading"
              >
                Jump Back In
              </h2>
              <div className="community-jump-back-list">
                {recentPlaylists.map((playlist) => (
                  <Link
                    className="community-jump-back-item"
                    href={`/community-playlists/${playlist.id}`}
                    key={playlist.id}
                  >
                    {playlist.cover_image_url ? (
                      <img
                        className="community-jump-back-cover"
                        src={playlist.cover_image_url}
                        alt=""
                      />
                    ) : (
                      <span
                        className="community-jump-back-placeholder"
                        aria-hidden="true"
                      />
                    )}
                    <span className="community-jump-back-copy">
                      <strong>{playlist.name}</strong>
                      <small>
                        {playlist.creator.name} · {playlist.song_count} songs
                      </small>
                    </span>
                  </Link>
                ))}
              </div>
            </section>
          )}
'''
          new_markup = '''          {recentPlaylists.length > 0 && (
            <section className="community-jump-back" aria-labelledby="community-jump-back-heading">
              <h2
                className="community-jump-back-heading"
                id="community-jump-back-heading"
              >
                Jump Back In
              </h2>
              <RecentPlaylistCards
                playlists={recentPlaylists.map((playlist) => ({
                  key: `community:${playlist.id}`,
                  href: `/community-playlists/${playlist.id}`,
                  name: playlist.name,
                  coverImageUrl: playlist.cover_image_url,
                  metadata: `${playlist.creator.name} · ${playlist.song_count} songs`,
                }))}
              />
            </section>
          )}
'''
          assert community.count(old_markup) == 1
          community_path.write_text(community.replace(old_markup, new_markup))
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/curated-playlists/CuratedJumpBackIn.tsx apps/web/app/community-playlists/page.tsx
          git commit -m "Use shared recent playlist cards everywhere"
          git push origin HEAD:agent/recent-playlist-migration
