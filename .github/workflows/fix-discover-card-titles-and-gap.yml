name: Fix Discover card titles and shelf gap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-discover-card-titles-and-gap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix source typography and mood shelf gap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shared_path = Path("packages/shared/styles/playlist-library.css")
          shared = shared_path.read_text()

          old_group = '''/* Shared playlist title and count typography across Discover and My Playlists. */
          .discover-mood-card h3,
          .playlists-page .playlist-gallery-content h3,
          .playlists-page .playlist-row-main span {
            color: var(--text-primary) !important;
            font-family: inherit !important;
            font-size: 13.5px !important;
            font-weight: 500 !important;
            line-height: 1.25 !important;
            letter-spacing: normal !important;
          }

          .discover-playlist-card h3 {
            color: var(--text-primary) !important;
            font-family: inherit !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            line-height: 1.25 !important;
            letter-spacing: normal !important;
          }
          '''
          new_group = '''/* Shared playlist title and count typography for My Playlists. */
          .playlists-page .playlist-gallery-content h3,
          .playlists-page .playlist-row-main span {
            color: var(--text-primary) !important;
            font-family: inherit !important;
            font-size: 13.5px !important;
            font-weight: 500 !important;
            line-height: 1.25 !important;
            letter-spacing: normal !important;
          }
          '''
          if shared.count(old_group) != 1:
              raise SystemExit("Expected conflicting Discover typography block exactly once")
          shared_path.write_text(shared.replace(old_group, new_group, 1))

          discover_css_path = Path("apps/web/app/discover/discover-page.css")
          discover_css = discover_css_path.read_text()
          old_scroller = '''body:has(.discover-page-root)
            .discover-mood-section
            .curated-playlist-shelf-scroller {
            padding-right: 0 !important;
          '''
          new_scroller = '''body:has(.discover-page-root)
            .discover-mood-section
            .curated-playlist-shelf-scroller {
            gap: 12px;
            padding-right: 0 !important;
          '''
          if discover_css.count(old_scroller) != 1:
              raise SystemExit("Expected mood shelf scroller rule exactly once")
          discover_css_path.write_text(discover_css.replace(old_scroller, new_scroller, 1))

          page_path = Path("apps/web/app/discover/page.tsx")
          page = page_path.read_text()
          old_class = 'className="curated-playlist-shelf-scroller flex gap-3 overflow-x-auto overflow-y-hidden scroll-smooth overscroll-x-contain [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"'
          new_class = 'className="curated-playlist-shelf-scroller flex overflow-x-auto overflow-y-hidden scroll-smooth overscroll-x-contain [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"'
          if page.count(old_class) != 1:
              raise SystemExit("Expected mood shelf utility gap exactly once")
          page_path.write_text(page.replace(old_class, new_class, 1))
          PY

      - name: Commit source fix and remove workflow
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-discover-card-titles-and-gap.yml
          git add packages/shared/styles/playlist-library.css apps/web/app/discover/discover-page.css apps/web/app/discover/page.tsx .github/workflows/fix-discover-card-titles-and-gap.yml
          git commit -m "Fix Discover card titles and mood shelf spacing"
          git push origin main
