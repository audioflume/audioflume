name: Apply header playlist filter weights

on:
  push:
    branches:
      - style/header-playlist-filter-weights

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/header-playlist-filter-weights
          fetch-depth: 0

      - name: Apply exact typography weight changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/web/components/Header.tsx'): [
                  (
                      '''        .filmwave-header-tonal-wordmark {\n          display: inline-flex !important;\n          align-items: center !important;\n          color: var(--text-primary) !important;\n          font-family: var(--font-zalando-sans), ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;\n          font-size: 22px !important;\n          font-weight: 600 !important;''',
                      '''        .filmwave-header-tonal-wordmark {\n          display: inline-flex !important;\n          align-items: center !important;\n          color: var(--text-primary) !important;\n          font-family: var(--font-zalando-sans), ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;\n          font-size: 22px !important;\n          font-weight: 500 !important;'''
                  ),
              ],
              Path('packages/shared/styles/app-chrome.css'): [
                  (
                      '''.filmwave-header-nav-link,\n.filmwave-header .filmwave-header-nav-link {\n  display: inline-flex;\n  height: var(--filmwave-header-nav-height);\n  cursor: pointer;\n  align-items: center;\n  gap: 6px;\n  border: 0;\n  border-radius: var(--filmwave-header-nav-radius);\n  background: transparent;\n  color: var(--text-secondary);\n  padding: 0 16px;\n  font-family: inherit;\n  font-size: 12px !important;\n  font-weight: 320 !important;''',
                      '''.filmwave-header-nav-link,\n.filmwave-header .filmwave-header-nav-link {\n  display: inline-flex;\n  height: var(--filmwave-header-nav-height);\n  cursor: pointer;\n  align-items: center;\n  gap: 6px;\n  border: 0;\n  border-radius: var(--filmwave-header-nav-radius);\n  background: transparent;\n  color: var(--text-secondary);\n  padding: 0 16px;\n  font-family: inherit;\n  font-size: 12px !important;\n  font-weight: 500 !important;'''
                  ),
                  (
                      '''.filmwave-playlists-mega-page-link span {\n  color: var(--text-primary);\n  font-size: 13px;\n  font-weight: 320;''',
                      '''.filmwave-playlists-mega-page-link span {\n  color: var(--text-primary);\n  font-size: 13px;\n  font-weight: 500;'''
                  ),
              ],
              Path('apps/web/app/music-filter-rail-order.css'): [
                  (
                      '''main > section:has(.fw-music-content-column .fw-filter-panel-wrap)\n  .fw-filter-group-label {\n  color: #fff;\n  font-family: var(--font-zalando-sans), sans-serif;\n  font-size: 11px;\n  font-weight: 320;''',
                      '''main > section:has(.fw-music-content-column .fw-filter-panel-wrap)\n  .fw-filter-group-label {\n  color: #fff;\n  font-family: var(--font-zalando-sans), sans-serif;\n  font-size: 11px;\n  font-weight: 500;'''
                  ),
                  (
                      '''main > section:has(.fw-filter-panel-wrap) .fw-filter-panel-body:has(.fw-filter-rail-item[data-filter-section-id="playlist"].is-active) .fw-filter-group-label::before {\n  content: "Playlists";\n  font-size: 11px;\n  font-weight: 320;''',
                      '''main > section:has(.fw-filter-panel-wrap) .fw-filter-panel-body:has(.fw-filter-rail-item[data-filter-section-id="playlist"].is-active) .fw-filter-group-label::before {\n  content: "Playlists";\n  font-size: 11px;\n  font-weight: 500;'''
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Verify only requested files changed
        shell: bash
        run: |
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "apps/web/app/music-filter-rail-order.css apps/web/components/Header.tsx packages/shared/styles/app-chrome.css "
          node tools/style-guard.mjs

      - name: Commit requested changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-header-playlist-filter-weights.yml
          git add apps/web/components/Header.tsx packages/shared/styles/app-chrome.css apps/web/app/music-filter-rail-order.css .github/workflows/apply-header-playlist-filter-weights.yml
          git commit -m "Adjust header playlist and filter title weights"
          git push origin HEAD:style/header-playlist-filter-weights
