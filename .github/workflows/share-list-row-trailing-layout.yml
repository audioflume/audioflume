name: Share list row trailing layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/share-list-row-trailing-layout.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Share playlist and project trailing geometry
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          theme_path = Path('packages/shared/styles/theme.css')
          theme = theme_path.read_text()
          theme_anchor = '''  --filmwave-ui-title-line-height: 1.1;
'''
          theme_insert = '''  --filmwave-ui-title-line-height: 1.1;

  /* Shared list-row trailing metadata geometry. */
  --filmwave-list-row-status-width: 12px;
  --filmwave-list-row-count-width: 64px;
  --filmwave-list-row-action-width: 50px;
  --filmwave-list-row-column-gap: 14px;
  --filmwave-list-row-status-offset: 12px;
'''
          if '--filmwave-list-row-status-width' not in theme:
              if theme_anchor not in theme:
                  raise SystemExit('Theme insertion point not found')
              theme = theme.replace(theme_anchor, theme_insert, 1)
              theme_path.write_text(theme)

          playlist_path = Path('apps/web/app/playlists/template.tsx')
          playlist = playlist_path.read_text()
          replacements = [
              ('grid-template-columns: 50px minmax(0, 1fr) 12px 64px !important;',
               'grid-template-columns: 50px minmax(0, 1fr) var(--filmwave-list-row-status-width) var(--filmwave-list-row-count-width) !important;'),
              ('column-gap: 14px !important;',
               'column-gap: var(--filmwave-list-row-column-gap) !important;'),
              ('width: 64px;\n          justify-self: start;\n          text-align: left;',
               'width: var(--filmwave-list-row-count-width);\n          justify-self: start;\n          text-align: left;'),
              ('width: 12px;\n          margin-left: 0;\n          justify-self: end;\n          transform: translateX(12px);',
               'width: var(--filmwave-list-row-status-width);\n          margin-left: 0;\n          justify-self: end;\n          transform: translateX(var(--filmwave-list-row-status-offset));'),
          ]
          for old, new in replacements:
              if old not in playlist:
                  raise SystemExit(f'Playlist block not found: {old[:70]!r}')
              playlist = playlist.replace(old, new)
          playlist_path.write_text(playlist)

          projects_path = Path('apps/web/app/projects/layout.tsx')
          projects = projects_path.read_text()
          project_replacements = [
              ('grid-template-columns: minmax(0, 1fr) 12px minmax(84px, 120px) 50px !important;\n          column-gap: 0 !important;',
               'grid-template-columns: minmax(0, 1fr) var(--filmwave-list-row-status-width) var(--filmwave-list-row-count-width) var(--filmwave-list-row-action-width) !important;\n          column-gap: var(--filmwave-list-row-column-gap) !important;'),
              ('width: 12px;\n          align-items: center;\n          justify-content: center;\n          justify-self: end;',
               'width: var(--filmwave-list-row-status-width);\n          align-items: center;\n          justify-content: center;\n          justify-self: end;\n          transform: translateX(var(--filmwave-list-row-status-offset));'),
              ('grid-column: 3;\n          justify-self: end;\n          text-align: right;',
               'grid-column: 3;\n          width: var(--filmwave-list-row-count-width);\n          justify-self: start;\n          text-align: left;'),
              ('grid-template-columns: minmax(0, 1fr) 12px minmax(70px, 96px) 50px !important;\n            column-gap: 0 !important;',
               'grid-template-columns: minmax(0, 1fr) var(--filmwave-list-row-status-width) var(--filmwave-list-row-count-width) var(--filmwave-list-row-action-width) !important;\n            column-gap: var(--filmwave-list-row-column-gap) !important;'),
          ]
          for old, new in project_replacements:
              if old not in projects:
                  raise SystemExit(f'Projects block not found: {old[:70]!r}')
              projects = projects.replace(old, new, 1)
          projects_path.write_text(projects)

          Path('.github/workflows/share-list-row-trailing-layout.yml').unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q -- '--filmwave-list-row-status-width: 12px' packages/shared/styles/theme.css
          grep -q 'var(--filmwave-list-row-status-width) var(--filmwave-list-row-count-width)' apps/web/app/playlists/template.tsx
          grep -q 'var(--filmwave-list-row-status-width) var(--filmwave-list-row-count-width) var(--filmwave-list-row-action-width)' apps/web/app/projects/layout.tsx
          grep -A8 'projects-row-count' apps/web/app/projects/layout.tsx | grep -q 'justify-self: start'
          grep -A8 'projects-row-archive-status' apps/web/app/projects/layout.tsx | grep -q 'filmwave-list-row-status-offset'
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Share playlist and project trailing layout"
          git push origin main
