name: Replace Aktiv Grotesk with Zalando Sans

on:
  push:
    branches:
      - fix/replace-aktiv-with-zalando

permissions:
  contents: write

jobs:
  replace-font-references:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/replace-aktiv-with-zalando
          fetch-depth: 0

      - name: Replace active Aktiv Grotesk references
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          changed = []

          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path)
              try:
                  data = path.read_bytes()
                  text = data.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              original = text
              text = text.replace("var(--font-aktiv-grotesk)", "var(--font-zalando-sans)")

              if raw_path != "packages/shared/styles/fonts.css":
                  text = text.replace('"aktiv-grotesk"', '"Zalando Sans"')
                  text = text.replace("'aktiv-grotesk'", "'Zalando Sans'")
                  text = text.replace("font-family: aktiv-grotesk", 'font-family: "Zalando Sans"')

              if text != original:
                  path.write_text(text, encoding="utf-8", newline="")
                  changed.append(raw_path)

          print(f"Updated {len(changed)} files")
          for path in changed:
              print(path)

          remaining_vars = subprocess.run(
              ["git", "grep", "-n", "-F", "var(--font-aktiv-grotesk)"],
              text=True,
              capture_output=True,
          )
          if remaining_vars.returncode == 0:
              print("Remaining active Aktiv token references:")
              print(remaining_vars.stdout)
              raise SystemExit(1)

          direct_aktiv = subprocess.run(
              ["git", "grep", "-n", "-E", r'font-family:[[:space:]]*[\"\x27]?aktiv-grotesk'],
              text=True,
              capture_output=True,
          )
          direct_lines = [
              line for line in direct_aktiv.stdout.splitlines()
              if not line.startswith("packages/shared/styles/fonts.css:")
          ]
          if direct_lines:
              print("Remaining direct Aktiv font-family references:")
              print("\n".join(direct_lines))
              raise SystemExit(1)
          PY

      - name: Remove one-time workflow and commit replacement
        run: |
          rm .github/workflows/replace-aktiv-with-zalando.yml
          git config user.name "audioflume"
          git config user.email "filmwave.webmaster@gmail.com"
          git add -A
          git commit -m "Replace Aktiv Grotesk with Zalando Sans"
          git push origin HEAD:fix/replace-aktiv-with-zalando
