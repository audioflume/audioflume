name: Apply shared Discover card title typography

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write

jobs:
  apply:
    if: github.event.comment.body == '/apply-discover-card-title-typography'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Consolidate card title typography
        run: |
          python3 - <<'PY'
          from pathlib import Path

          layout_path = Path("apps/web/app/discover/layout.tsx")
          layout = layout_path.read_text()

          old_tokens = '''  body:has(.discover-page-root) {
    --discover-page-gutter: clamp(28px, 5.2vw, 82px);
  }
'''
          new_tokens = '''  body:has(.discover-page-root) {
    --discover-page-gutter: clamp(28px, 5.2vw, 82px);
    --discover-playlist-card-title-font-family: var(--font-aktiv-grotesk), sans-serif;
    --discover-playlist-card-title-font-size: 15px;
    --discover-playlist-card-title-font-weight: 500;
    --discover-playlist-card-title-letter-spacing: -0.035em;
    --discover-playlist-card-title-line-height: 1.25;
  }
'''
          if layout.count(old_tokens) != 1:
              raise SystemExit("Expected Discover typography token source exactly once")
          layout = layout.replace(old_tokens, new_tokens, 1)

          old_title_rule = '''  .discover-mood-card h3,
  .discover-playlist-card h3 {
    margin: 10px 0 0;
    color: var(--text-primary);
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.25;
  }
'''
          new_title_rule = '''  .discover-mood-card h3,
  .discover-playlist-card h3 {
    margin: 10px 0 0;
    color: var(--text-primary);
    font-family: var(--discover-playlist-card-title-font-family);
    font-size: var(--discover-playlist-card-title-font-size);
    font-weight: var(--discover-playlist-card-title-font-weight);
    letter-spacing: var(--discover-playlist-card-title-letter-spacing);
    line-height: var(--discover-playlist-card-title-line-height);
  }
'''
          if layout.count(old_title_rule) != 1:
              raise SystemExit("Expected Discover card title rule exactly once")
          layout = layout.replace(old_title_rule, new_title_rule, 1)
          layout_path.write_text(layout)

          card_path = Path("apps/web/components/curated/CuratedPlaylistCard.module.css")
          card = card_path.read_text()
          old_card_title = '''  color: var(--text-primary);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.25;
'''
          new_card_title = '''  color: var(--text-primary);
  font-family: var(--discover-playlist-card-title-font-family, inherit);
  font-size: var(--discover-playlist-card-title-font-size, 15px);
  font-weight: var(--discover-playlist-card-title-font-weight, 500);
  letter-spacing: var(--discover-playlist-card-title-letter-spacing, -0.035em);
  line-height: var(--discover-playlist-card-title-line-height, 1.25);
'''
          if card.count(old_card_title) != 1:
              raise SystemExit("Expected Curated card title typography exactly once")
          card = card.replace(old_card_title, new_card_title, 1)
          card_path.write_text(card)
          PY

      - name: Commit source changes and remove workflow
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/apply-discover-card-title-typography.yml
          git add apps/web/app/discover/layout.tsx apps/web/components/curated/CuratedPlaylistCard.module.css .github/workflows/apply-discover-card-title-typography.yml
          git commit -m "Share Discover playlist card title typography"
          git push origin main
