name: Share playlist project row trailing structure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/share-playlist-project-row-trailing.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Share list row status and count structure
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          component = Path('apps/web/components/ListRowStatusCount.tsx')
          component.write_text('''import type { ReactNode } from "react";\n\ntype ListRowStatusCountProps = {\n  status?: ReactNode;\n  statusLabel?: string;\n  count: ReactNode;\n  statusClassName?: string;\n  countClassName?: string;\n};\n\nexport default function ListRowStatusCount({\n  status,\n  statusLabel,\n  count,\n  statusClassName = "",\n  countClassName = "",\n}: ListRowStatusCountProps) {\n  return (\n    <>\n      <span\n        className={`filmwave-list-row-status ${statusClassName}`.trim()}\n        aria-label={status ? statusLabel : undefined}\n        title={status ? statusLabel : undefined}\n      >\n        {status}\n      </span>\n      <span className={`filmwave-list-row-count ${countClassName}`.trim()}>\n        {count}\n      </span>\n    </>\n  );\n}\n''')

          app_chrome = Path('packages/shared/styles/app-chrome.css')
          chrome_text = app_chrome.read_text()
          shared_css = '''\n\n/* Shared trailing status/count geometry for playlist and project list rows. */\n.filmwave-list-row-status {\n  display: inline-flex;\n  width: 12px;\n  height: 14px;\n  align-items: center;\n  justify-content: flex-end;\n  justify-self: end;\n  transform: translateX(12px);\n  color: var(--text-muted);\n  line-height: 0;\n}\n\n.filmwave-list-row-status > svg,\n.filmwave-list-row-status > span,\n.filmwave-list-row-status > span > svg {\n  display: block;\n  width: 12px;\n  height: 12px;\n  flex: 0 0 12px;\n}\n\n.filmwave-list-row-count {\n  width: 64px;\n  justify-self: start;\n  text-align: left;\n}\n'''
          if 'Shared trailing status/count geometry for playlist and project list rows.' not in chrome_text:
              app_chrome.write_text(chrome_text.rstrip() + shared_css + '\n')

          playlist = Path('apps/web/app/playlists/page.tsx')
          text = playlist.read_text()
          text = text.replace(
              'import LoadingSpinner from "@/components/LoadingSpinner";\n',
              'import LoadingSpinner from "@/components/LoadingSpinner";\nimport ListRowStatusCount from "@/components/ListRowStatusCount";\nimport PublicPlaylistIcon from "@/components/icons/PublicPlaylistIcon";\n',
              1,
          )
          old = '''          <div className="playlist-row-count">\n            {formatSongCount(stats?.songCount ?? 0)}\n          </div>\n        </Link>'''
          new = '''          <ListRowStatusCount\n            status={\n              playlist.is_public ? (\n                <PublicPlaylistIcon className="playlist-public-name-icon" />\n              ) : undefined\n            }\n            statusLabel="Public playlist"\n            count={formatSongCount(stats?.songCount ?? 0)}\n            statusClassName="playlist-row-public-status"\n            countClassName="playlist-row-count"\n          />\n        </Link>'''
          if old not in text:
              raise SystemExit('Normal playlist list-row count block not found')
          text = text.replace(old, new, 1)
          playlist.write_text(text)

          template = Path('apps/web/app/playlists/template.tsx')
          text = template.read_text()
          old = '''            const listCount = link.querySelector<HTMLElement>(".playlist-row-count");\n            const gridName = link.querySelector<HTMLElement>(\n              ".playlist-gallery-content h3",\n            );\n            const target = listCount ?? gridName;\n            if (!target) return;\n\n            targets.push({\n              key: `playlist-${playlist.id}`,\n              element: target,\n              detail: false,\n              list: Boolean(listCount),\n            });'''
          new = '''            const gridName = link.querySelector<HTMLElement>(\n              ".playlist-gallery-content h3",\n            );\n            if (!gridName) return;\n\n            targets.push({\n              key: `playlist-${playlist.id}`,\n              element: gridName,\n              detail: false,\n              list: false,\n            });'''
          if old not in text:
              raise SystemExit('Playlist injected list icon target block not found')
          text = text.replace(old, new, 1)
          template.write_text(text)

          projects = Path('apps/web/app/projects/page.tsx')
          text = projects.read_text()
          text = text.replace(
              'import MoreIcon from "@/components/icons/MoreIcon";\n',
              'import MoreIcon from "@/components/icons/MoreIcon";\nimport ListRowStatusCount from "@/components/ListRowStatusCount";\n',
              1,
          )
          old = '''      <div className="projects-row-archive-status">\n        {project.is_archived && (\n          <span className="projects-row-archive-icon" aria-label="Archived project" title="Archived project">\n            <ArchiveIcon />\n          </span>\n        )}\n      </div>\n\n      <div className="projects-row-count">\n        {formatFileCount(getProjectFileCount(project))}\n      </div>'''
          new = '''      <ListRowStatusCount\n        status={project.is_archived ? <ArchiveIcon /> : undefined}\n        statusLabel="Archived project"\n        count={formatFileCount(getProjectFileCount(project))}\n        statusClassName="projects-row-archive-status"\n        countClassName="projects-row-count"\n      />'''
          if old not in text:
              raise SystemExit('Project archive/count block not found')
          text = text.replace(old, new, 1)
          projects.write_text(text)

          layout = Path('apps/web/app/projects/layout.tsx')
          text = layout.read_text()
          old_status = '''        .projects-page .projects-row-archive-status {\n          display: inline-flex;\n          grid-column: 2;\n          width: 12px;\n          align-items: center;\n          justify-content: center;\n          justify-self: end;\n          transform: translateX(12px);\n          color: var(--text-muted);\n          line-height: 0;\n        }'''
          new_status = '''        .projects-page .projects-row-archive-status {\n          grid-column: 2;\n        }'''
          if old_status not in text:
              raise SystemExit('Project route archive status style block not found')
          text = text.replace(old_status, new_status, 1)

          old_count = '''        .projects-page .projects-row-count {\n          grid-column: 3;\n          width: 64px;\n          justify-self: start;\n          text-align: left;\n          font-size: 11.5px;\n          font-weight: 400;\n          line-height: 1.35;\n          color: var(--text-subtle);\n        }'''
          new_count = '''        .projects-page .projects-row-count {\n          grid-column: 3;\n          font-size: 11.5px;\n          font-weight: 400;\n          line-height: 1.35;\n          color: var(--text-subtle);\n        }'''
          if old_count not in text:
              raise SystemExit('Project route count style block not found')
          text = text.replace(old_count, new_count, 1)
          layout.write_text(text)

          Path('.github/workflows/share-playlist-project-row-trailing.yml').unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'ListRowStatusCount' apps/web/app/playlists/page.tsx
          grep -q 'ListRowStatusCount' apps/web/app/projects/page.tsx
          grep -q 'filmwave-list-row-status' packages/shared/styles/app-chrome.css
          ! grep -q 'const listCount = link.querySelector' apps/web/app/playlists/template.tsx
          test ! -e .github/workflows/share-playlist-project-row-trailing.yml
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Share playlist and project row trailing structure"
          git push origin main
