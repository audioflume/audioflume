name: Normalize Aktiv Grotesk font stacks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-aktiv-font-stack.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize font stacks
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/normalize-aktiv-font-stack.yml')
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.pdf',
              '.woff', '.woff2', '.ttf', '.otf', '.mp3', '.wav', '.zip',
          }

          replacements = {
              'var(--font-aktiv-grotesk), var(--font-aktiv-grotesk), sans-serif':
                  'var(--font-aktiv-grotesk), sans-serif',
              'var(--font-aktiv-grotesk), "aktiv-grotesk", ui-sans-serif':
                  'var(--font-aktiv-grotesk), ui-sans-serif',
          }

          for path in Path('.').rglob('*'):
              if not path.is_file() or path == workflow or '.git' in path.parts:
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')

          workflow.unlink()

          legacy_needles = (
              'font-satoshi', 'font-instrument-sans', 'satoshi',
              'instrument sans',
          )
          remaining = []
          duplicates = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              lowered = text.lower()
              if any(needle in lowered for needle in legacy_needles):
                  remaining.append(str(path))
              if 'var(--font-aktiv-grotesk), var(--font-aktiv-grotesk)' in text:
                  duplicates.append(str(path))

          if remaining:
              raise SystemExit('Legacy font references remain: ' + ', '.join(remaining))
          if duplicates:
              raise SystemExit('Duplicate Aktiv font references remain: ' + ', '.join(duplicates))
          PY

      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Aktiv Grotesk font stacks"
          git push origin main
