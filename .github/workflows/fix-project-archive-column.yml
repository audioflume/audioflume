name: Fix project archive column

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-project-archive-column.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct project archive and count columns
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/projects/layout.tsx')
          text = path.read_text()

          old_desktop = '''        .projects-page .projects-row:not(.projects-row-skeleton) {
          grid-template-columns: minmax(0, 1fr) 12px 64px 50px !important;
          column-gap: 14px !important;
        }'''
          new_desktop = '''        .projects-page .projects-row:not(.projects-row-skeleton) {
          grid-template-columns: minmax(0, 1fr) 12px minmax(84px, 120px) 50px !important;
          column-gap: 0 !important;
        }'''

          old_status = '''        .projects-page .projects-row-archive-status {
          grid-column: 2;
          width: 12px;
          justify-self: end;
          transform: translateX(12px);
        }'''
          new_status = '''        .projects-page .projects-row-archive-status {
          display: inline-flex;
          grid-column: 2;
          width: 12px;
          align-items: center;
          justify-content: center;
          justify-self: end;
          color: var(--text-muted);
          line-height: 0;
        }'''

          old_count = '''        .projects-page .projects-row-count {
          grid-column: 3;
          width: 64px;
          justify-self: start;
          text-align: left;
          font-size: 11.5px;
          font-weight: 400;
          line-height: 1.35;
          color: var(--text-subtle);
        }'''
          new_count = '''        .projects-page .projects-row-count {
          grid-column: 3;
          justify-self: end;
          text-align: right;
          font-size: 11.5px;
          font-weight: 400;
          line-height: 1.35;
          color: var(--text-subtle);
        }'''

          old_mobile = '''          .projects-page .projects-row:not(.projects-row-skeleton) {
            grid-template-columns: minmax(0, 1fr) 12px 64px 50px !important;
            column-gap: 14px !important;
            padding: 0 18px !important;
          }'''
          new_mobile = '''          .projects-page .projects-row:not(.projects-row-skeleton) {
            grid-template-columns: minmax(0, 1fr) 12px minmax(70px, 96px) 50px !important;
            column-gap: 0 !important;
            padding: 0 18px !important;
          }'''

          replacements = [
              (old_desktop, new_desktop),
              (old_status, new_status),
              (old_count, new_count),
              (old_mobile, new_mobile),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected block not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/fix-project-archive-column.yml').unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'grid-template-columns: minmax(0, 1fr) 12px minmax(84px, 120px) 50px' apps/web/app/projects/layout.tsx
          grep -q 'grid-template-columns: minmax(0, 1fr) 12px minmax(70px, 96px) 50px' apps/web/app/projects/layout.tsx
          grep -A8 'projects-row-count' apps/web/app/projects/layout.tsx | grep -q 'justify-self: end'
          ! grep -A6 'projects-row-archive-status' apps/web/app/projects/layout.tsx | grep -q 'translateX'
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep project file count anchored"
          git push origin main
