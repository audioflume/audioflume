name: Fix project archive column

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-project-archive-column.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Give archive icon its own column
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          page = Path('apps/web/app/projects/page.tsx')
          text = page.read_text()

          old_markup = '''      <div className="projects-row-count">\n        <span>{formatFileCount(getProjectFileCount(project))}</span>\n        {project.is_archived && (\n          <span className="projects-row-archive-icon" aria-label="Archived project" title="Archived project">\n            <ArchiveIcon />\n          </span>\n        )}\n      </div>'''
          new_markup = '''      <div className="projects-row-archive-status">\n        {project.is_archived && (\n          <span className="projects-row-archive-icon" aria-label="Archived project" title="Archived project">\n            <ArchiveIcon />\n          </span>\n        )}\n      </div>\n\n      <div className="projects-row-count">\n        {formatFileCount(getProjectFileCount(project))}\n      </div>'''
          if old_markup not in text:
              raise SystemExit('Expected project row archive/count markup not found')
          text = text.replace(old_markup, new_markup, 1)

          replacements = {
            '.projects-row { display: grid; min-height: 72px; grid-template-columns: minmax(0, 1fr) minmax(84px, 120px) 32px; gap: 0;': '.projects-row { display: grid; min-height: 72px; grid-template-columns: minmax(0, 1fr) 12px minmax(84px, 120px) 32px; column-gap: 14px;',
            '.projects-row-count { display: inline-flex; justify-self: end; align-items: center; gap: 10px; text-align: right; font-size: 11.5px; font-weight: 400; line-height: 1.35; color: var(--text-subtle); }\n        .projects-row-archive-icon { display: inline-flex; width: 13px; height: 13px; flex: 0 0 13px; align-items: center; justify-content: center; color: var(--text-muted); line-height: 0; }': '.projects-row-archive-status { display: inline-flex; width: 12px; justify-self: end; align-items: center; justify-content: center; transform: translateX(12px); color: var(--text-muted); line-height: 0; }\n        .projects-row-archive-icon { display: inline-flex; width: 12px; height: 13px; align-items: center; justify-content: center; color: inherit; line-height: 0; }\n        .projects-row-count { justify-self: start; width: 64px; text-align: left; font-size: 11.5px; font-weight: 400; line-height: 1.35; color: var(--text-subtle); }',
            '.projects-row-skeleton { grid-template-columns: 42px minmax(0, 1fr) minmax(84px, 120px) 32px; cursor: default; pointer-events: none; }': '.projects-row-skeleton { grid-template-columns: 42px minmax(0, 1fr) 12px minmax(84px, 120px) 32px; column-gap: 14px; cursor: default; pointer-events: none; }',
            '.projects-row { grid-template-columns: minmax(0, 1fr) minmax(70px, 96px) 32px; gap: 0; padding: 0 18px; }': '.projects-row { grid-template-columns: minmax(0, 1fr) 12px minmax(70px, 96px) 32px; column-gap: 14px; padding: 0 18px; }',
            '.projects-row-skeleton { grid-template-columns: 42px minmax(0, 1fr) minmax(70px, 96px) 32px; }': '.projects-row-skeleton { grid-template-columns: 42px minmax(0, 1fr) 12px minmax(70px, 96px) 32px; column-gap: 14px; }',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected page CSS block not found: {old[:90]}')
              text = text.replace(old, new, 1)
          page.write_text(text)

          layout = Path('apps/web/app/projects/layout.tsx')
          text = layout.read_text()

          old_grid = '''        .projects-page .projects-row:not(.projects-row-skeleton) {\n          grid-template-columns: minmax(0, 1fr) minmax(84px, 120px) 50px !important;\n          gap: 0 !important;\n        }'''
          new_grid = '''        .projects-page .projects-row:not(.projects-row-skeleton) {\n          grid-template-columns: minmax(0, 1fr) 12px 64px 50px !important;\n          column-gap: 14px !important;\n        }'''
          if old_grid not in text:
              raise SystemExit('Expected desktop project layout grid not found')
          text = text.replace(old_grid, new_grid, 1)

          old_count = '''        .projects-page .projects-row-count {\n          position: relative;\n          display: block;\n          grid-column: 2;\n          justify-self: end;\n          text-align: right;\n          font-size: 11.5px;\n          font-weight: 400;\n          line-height: 1.35;\n          color: var(--text-subtle);\n        }\n\n        .projects-page .projects-row-archive-icon {\n          position: absolute;\n          top: 50%;\n          right: calc(100% + 2px);\n          display: inline-flex;\n          width: 12px;\n          height: 13px;\n          margin: 0;\n          align-items: center;\n          justify-content: center;\n          transform: translateY(-50%);\n          color: var(--text-muted);\n          line-height: 0;\n        }\n\n        .projects-page .projects-row-actions {\n          grid-column: 3;'''
          new_count = '''        .projects-page .projects-row-archive-status {\n          grid-column: 2;\n          width: 12px;\n          justify-self: end;\n          transform: translateX(12px);\n        }\n\n        .projects-page .projects-row-count {\n          grid-column: 3;\n          width: 64px;\n          justify-self: start;\n          text-align: left;\n          font-size: 11.5px;\n          font-weight: 400;\n          line-height: 1.35;\n          color: var(--text-subtle);\n        }\n\n        .projects-page .projects-row-actions {\n          grid-column: 4;'''
          if old_count not in text:
              raise SystemExit('Expected old absolute archive positioning block not found')
          text = text.replace(old_count, new_count, 1)

          old_mobile = '''          .projects-page .projects-row:not(.projects-row-skeleton) {\n            grid-template-columns: minmax(0, 1fr) minmax(70px, 96px) 50px !important;\n            gap: 0 !important;\n            padding: 0 18px !important;\n          }'''
          new_mobile = '''          .projects-page .projects-row:not(.projects-row-skeleton) {\n            grid-template-columns: minmax(0, 1fr) 12px 64px 50px !important;\n            column-gap: 14px !important;\n            padding: 0 18px !important;\n          }'''
          if old_mobile not in text:
              raise SystemExit('Expected mobile project layout grid not found')
          text = text.replace(old_mobile, new_mobile, 1)
          layout.write_text(text)

          Path('.github/workflows/fix-project-archive-column.yml').unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'className="projects-row-archive-status"' apps/web/app/projects/page.tsx
          grep -q 'grid-template-columns: minmax(0, 1fr) 12px 64px 50px' apps/web/app/projects/layout.tsx
          ! grep -q 'right: calc(100% + 2px)' apps/web/app/projects/layout.tsx
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Give project archive icon its own column"
          git push origin main
