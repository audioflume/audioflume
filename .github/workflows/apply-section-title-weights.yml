name: Apply section title weights

on:
  push:
    branches:
      - style/section-title-weights

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact typography changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'apps/web/components/Header.tsx',
              '''        .filmwave-header-tonal-wordmark {\n          display: inline-flex !important;\n          align-items: center !important;\n          color: var(--text-primary) !important;\n          font-family: var(--font-zalando-sans), ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;\n          font-size: 22px !important;\n          font-weight: 500 !important;''',
              '''        .filmwave-header-tonal-wordmark {\n          display: inline-flex !important;\n          align-items: center !important;\n          color: var(--text-primary) !important;\n          font-family: var(--font-zalando-sans), ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;\n          font-size: 22px !important;\n          font-weight: 550 !important;''',
              'header wordmark',
          )

          replace_once(
              'packages/shared/styles/theme.css',
              '--filmwave-section-title-font-weight: 200;',
              '--filmwave-section-title-font-weight: 450;',
              'canonical section title token',
          )

          replace_once(
              'packages/shared/styles/playlist-library.css',
              '''/* Shared section-title typography for Discover and Curated Playlists. */\n.discover-section-heading h2,\n.curated-playlist-shelf-heading h2 {\n  margin: 0 !important;\n  color: var(--text-primary) !important;\n  font-family: var(--font-zalando-sans), sans-serif !important;\n  font-size: 24px !important;\n  font-weight: 200 !important;''',
              '''/* Shared section-title typography for Discover and Curated Playlists. */\n.discover-section-heading h2,\n.curated-playlist-shelf-heading h2 {\n  margin: 0 !important;\n  color: var(--text-primary) !important;\n  font-family: var(--font-zalando-sans), sans-serif !important;\n  font-size: 24px !important;\n  font-weight: 450 !important;''',
              'discover curated section titles',
          )

          replace_once(
              'packages/shared/styles/playlist-library.css',
              '''/* Preserve the existing section-title styling for My Playlists. */\n.discover-song-section .fw-song-list-title,\n.playlists-page .playlists-hero .playlists-title,\n.playlists-page .playlists-hero .playlists-title::before {\n  margin: 0 !important;\n  color: var(--text-primary) !important;\n  font-family: var(--font-zalando-sans), sans-serif !important;\n  font-size: clamp(18px, 1.45vw, 24px) !important;\n  font-weight: 200 !important;''',
              '''/* Preserve the existing section-title styling for My Playlists. */\n.discover-song-section .fw-song-list-title,\n.playlists-page .playlists-hero .playlists-title,\n.playlists-page .playlists-hero .playlists-title::before {\n  margin: 0 !important;\n  color: var(--text-primary) !important;\n  font-family: var(--font-zalando-sans), sans-serif !important;\n  font-size: clamp(18px, 1.45vw, 24px) !important;\n  font-weight: 450 !important;''',
              'my playlists discover song section title',
          )

          replace_once(
              'apps/web/app/projects/[projectId]/ProjectDetailPage.css',
              '.project-detail-title { margin: 0; max-width: 640px; font-family: var(--font-zalando-sans); font-size: 24px; font-weight: 200; line-height: 1; letter-spacing: -0.025em; color: var(--text-primary); }',
              '.project-detail-title { margin: 0; max-width: 640px; font-family: var(--font-zalando-sans); font-size: 24px; font-weight: 450; line-height: 1; letter-spacing: -0.025em; color: var(--text-primary); }',
              'project detail page title',
          )
          PY
      - name: Verify scope
        run: |
          git diff --check
          git diff --exit-code -- . ':!apps/web/components/Header.tsx' ':!packages/shared/styles/theme.css' ':!packages/shared/styles/playlist-library.css' ':!apps/web/app/projects/[projectId]/ProjectDetailPage.css'
          grep -q -- '--filmwave-section-title-font-weight: 450;' packages/shared/styles/theme.css
          grep -q 'font-weight: 550 !important;' apps/web/components/Header.tsx
          grep -q 'project-detail-title.*font-weight: 450' 'apps/web/app/projects/[projectId]/ProjectDetailPage.css'
      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/apply-section-title-weights.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/components/Header.tsx packages/shared/styles/theme.css packages/shared/styles/playlist-library.css 'apps/web/app/projects/[projectId]/ProjectDetailPage.css' .github/workflows/apply-section-title-weights.yml
          git commit -m "Adjust section title typography weights"
          git push
