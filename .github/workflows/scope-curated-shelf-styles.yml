name: Scope curated shelf styles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scope-curated-shelf-styles.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Scope curated shelf styles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/curated-playlists/curated-playlists.css")
          css = path.read_text()

          old = '''.curated-playlist-shelf-scroller,
          .curated-playlist-skeleton-shelf > .relative > .flex {
          '''
          new = '''body:has(.curated-playlists-page-root) .curated-playlist-shelf-scroller,
          body:has(.curated-playlists-page-root)
            .curated-playlist-skeleton-shelf > .relative > .flex {
          '''

          if css.count(old) != 1:
              raise SystemExit("Expected global curated shelf selector exactly once")

          path.write_text(css.replace(old, new, 1))
          PY

      - name: Commit source fix and remove workflow
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/scope-curated-shelf-styles.yml
          git add apps/web/app/curated-playlists/curated-playlists.css .github/workflows/scope-curated-shelf-styles.yml
          git commit -m "Scope curated shelf styles to landing page"
          git push origin main
