name: Move playlist detail public icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/move-playlist-detail-public-icon.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move detail public icon into metadata row
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/playlists/template.tsx')
          text = path.read_text()

          old_target = '''        const title = document.querySelector<HTMLElement>(
          ".playlist-detail-page .playlist-detail-title",
        );

        if (playlist?.is_public && title) {
          targets.push({
            key: `playlist-detail-${playlist.id}`,
            element: title,
            detail: true,
            list: false,
          });
        }'''

          new_target = '''        const meta = document.querySelector<HTMLElement>(
          ".playlist-detail-page .playlist-detail-meta",
        );

        if (playlist?.is_public && meta) {
          targets.push({
            key: `playlist-detail-${playlist.id}`,
            element: meta,
            detail: true,
            list: false,
          });
        }'''

          if old_target not in text:
              raise SystemExit('Detail public icon target block not found')
          text = text.replace(old_target, new_target, 1)

          old_insert = '''        if (target.list) {
          target.element.insertAdjacentElement("beforebegin", host);
        } else {
          target.element.classList.add("playlist-name-has-public-icon");
          target.element.insertAdjacentElement("afterend", host);
        }'''

          new_insert = '''        if (target.list) {
          target.element.insertAdjacentElement("beforebegin", host);
        } else if (target.detail) {
          const separator = document.createElement("span");
          separator.className = "playlist-detail-dot playlist-public-icon-separator";
          separator.textContent = "·";
          separator.dataset.playlistPublicIconSeparator = target.key;
          target.element.append(separator, host);
        } else {
          target.element.classList.add("playlist-name-has-public-icon");
          target.element.insertAdjacentElement("afterend", host);
        }'''

          if old_insert not in text:
              raise SystemExit('Public icon insertion block not found')
          text = text.replace(old_insert, new_insert, 1)

          old_dispose = '''  function disposeMountedIcon(mounted: MountedPublicIcon) {
    mounted.title.classList.remove("playlist-name-has-public-icon");
    mounted.title.parentElement?.classList.remove("playlist-detail-public-title-parent");

    window.setTimeout(() => {
      mounted.root.unmount();
      mounted.host.remove();
    }, 0);
  }'''

          new_dispose = '''  function disposeMountedIcon(mounted: MountedPublicIcon) {
    mounted.title.classList.remove("playlist-name-has-public-icon");
    mounted.title.parentElement?.classList.remove("playlist-detail-public-title-parent");
    document
      .querySelector(`[data-playlist-public-icon-separator="${mounted.host.dataset.playlistPublicIconHost}"]`)
      ?.remove();

    window.setTimeout(() => {
      mounted.root.unmount();
      mounted.host.remove();
    }, 0);
  }'''

          if old_dispose not in text:
              raise SystemExit('Public icon cleanup block not found')
          text = text.replace(old_dispose, new_dispose, 1)

          old_position = '''  function positionDetailIcon(mounted: MountedPublicIcon) {
    if (!mounted.detail) return;

    const parent = mounted.title.parentElement;
    if (!parent) return;

    parent.classList.add("playlist-detail-public-title-parent");

    const titleRect = mounted.title.getBoundingClientRect();
    const parentRect = parent.getBoundingClientRect();
    const left = titleRect.right - parentRect.left + 6;
    const top = titleRect.top - parentRect.top + titleRect.height - 14.5;

    mounted.host.style.left = `${left}px`;
    mounted.host.style.top = `${top}px`;
  }'''

          new_position = '''  function positionDetailIcon(mounted: MountedPublicIcon) {
    if (!mounted.detail) return;

    mounted.host.style.position = "static";
    mounted.host.style.left = "auto";
    mounted.host.style.top = "auto";
    mounted.host.style.display = "inline-flex";
    mounted.host.style.alignItems = "center";
  }'''

          if old_position not in text:
              raise SystemExit('Detail icon positioning block not found')
          text = text.replace(old_position, new_position, 1)

          path.write_text(text)
          Path('.github/workflows/move-playlist-detail-public-icon.yml').unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'playlist-detail-page .playlist-detail-meta' apps/web/app/playlists/template.tsx
          grep -q 'playlist-public-icon-separator' apps/web/app/playlists/template.tsx
          grep -q 'target.element.append(separator, host)' apps/web/app/playlists/template.tsx
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Move playlist public icon into metadata"
          git push origin main

# trigger
