name: Patch backend typography restores

on:
  push:
    branches:
      - style/backend-typography-restores

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded typography restores
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}')
              p.write_text(s.replace(old, new, count))

          replace_exact(
              'apps/web/app/music-library-web-layout.css',
              '''main > section:has(.fw-music-content-column .fw-filter-panel-wrap) .fw-license-filter-title,\nmain > section:has(.fw-music-content-column .fw-filter-panel-wrap) .fw-filter-section-heading {\n  margin: 0;\n  padding: 0 12px;\n  color: var(--text-primary);\n  font-family: var(--font-zalando-sans), sans-serif;\n  font-size: 11px;\n  font-weight: 320;''',
              '''main > section:has(.fw-music-content-column .fw-filter-panel-wrap) .fw-license-filter-title,\nmain > section:has(.fw-music-content-column .fw-filter-panel-wrap) .fw-filter-section-heading {\n  margin: 0;\n  padding: 0 12px;\n  color: var(--text-primary);\n  font-family: var(--font-zalando-sans), sans-serif;\n  font-size: 11px;\n  font-weight: 500;'''
          )

          replace_exact(
              'packages/shared/styles/music-library-redesign.css',
              '''.fw-filter-group-label {\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  margin: 0 0 9px;\n  color: var(--text-muted);\n  font-size: 10.5px;\n  font-weight: 320;''',
              '''.fw-filter-group-label {\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  margin: 0 0 9px;\n  color: var(--text-muted);\n  font-size: 10.5px;\n  font-weight: 500;'''
          )

          replace_exact(
              'apps/web/app/admin/page.tsx',
              'text-[24px] font-[200] leading-none tracking-[-0.04em]',
              'text-[24px] font-[500] leading-none tracking-[-0.04em]'
          )

          replace_exact(
              'apps/web/app/admin/engagement/page.tsx',
              'text-[24px] font-[200] leading-none tracking-[-0.04em]',
              'text-[24px] font-[500] leading-none tracking-[-0.04em]'
          )
          replace_exact(
              'apps/web/app/admin/engagement/page.tsx',
              'text-[18px] font-[200] tracking-[-0.03em]',
              'text-[18px] font-[500] tracking-[-0.03em]'
          )

          replace_exact(
              'apps/web/components/artists/ArtistAnalytics.tsx',
              'text-[24px] font-[200] leading-none tracking-[-0.04em]',
              'text-[24px] font-[500] leading-none tracking-[-0.04em]'
          )
          replace_exact(
              'apps/web/components/artists/ArtistAnalytics.tsx',
              'text-[18px] font-[200] tracking-[-0.03em]',
              'text-[18px] font-[500] tracking-[-0.03em]'
          )

          replace_exact(
              'apps/web/components/artists/ArtistEarnings.tsx',
              'text-[24px] font-[200] leading-none tracking-[-0.04em]',
              'text-[24px] font-[500] leading-none tracking-[-0.04em]'
          )
          replace_exact(
              'apps/web/components/artists/ArtistEarnings.tsx',
              '''              <span className="text-xs font-[320] text-[var(--text-primary)]">\n                {formatMoney(item.amount_cents, item.currency)}\n              </span>''',
              '''              <span className="text-xs font-[500] text-[var(--text-primary)]">\n                {formatMoney(item.amount_cents, item.currency)}\n              </span>'''
          )
          replace_exact(
              'apps/web/components/artists/ArtistEarnings.tsx',
              'className="text-right text-xs font-[320] text-[var(--text-primary)]"',
              'className="text-right text-xs font-[500] text-[var(--text-primary)]"',
              2
          )

          replace_exact(
              'apps/web/components/artists/ArtistOverview.tsx',
              'text-[18px] font-[200] tracking-[-0.03em]',
              'text-[18px] font-[500] tracking-[-0.03em]'
          )
          replace_exact(
              'apps/web/components/artists/ArtistOverview.tsx',
              'text-[24px] font-[200] leading-none tracking-[-0.04em]',
              'text-[24px] font-[500] leading-none tracking-[-0.04em]'
          )
          replace_exact(
              'apps/web/components/artists/ArtistOverview.tsx',
              'text-[36px] font-[200] leading-none tracking-[-0.05em]',
              'text-[36px] font-[500] leading-none tracking-[-0.05em]'
          )
          replace_exact(
              'apps/web/components/artists/ArtistOverview.tsx',
              'className="mt-2 text-sm font-[320] text-[var(--text-primary)]"',
              'className="mt-2 text-sm font-[500] text-[var(--text-primary)]"'
          )

          replace_exact(
              'apps/web/app/song-player-typography.css',
              '''.filmwave-song-card .filmwave-song-genre {\n  font-weight: 400;\n}''',
              '''.filmwave-song-card .filmwave-song-genre {\n  font-weight: 320;\n}'''
          )
          PY
      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "8"
          git diff --name-only | sort
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/app/music-library-web-layout.css \
                  packages/shared/styles/music-library-redesign.css \
                  apps/web/app/admin/page.tsx \
                  apps/web/app/admin/engagement/page.tsx \
                  apps/web/components/artists/ArtistAnalytics.tsx \
                  apps/web/components/artists/ArtistEarnings.tsx \
                  apps/web/components/artists/ArtistOverview.tsx \
                  apps/web/app/song-player-typography.css
          git commit -m "Restore sidebar and backend metric weights"
          git push
