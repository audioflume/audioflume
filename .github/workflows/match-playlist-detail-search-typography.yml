name: Match playlist detail search typography

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/match-playlist-detail-search-typography.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match playlist search text styling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/playlists/[playlistId]/page.tsx')
          text = path.read_text()
          old = '.playlist-detail-search-input { width: 100%; background: transparent; font-size: 15px; font-weight: 300; color: var(--text-primary); outline: none; }'
          new = '.playlist-detail-search-input { width: 100%; background: transparent; color: var(--text-primary); font-family: var(--font-aktiv-grotesk); font-size: 12px; font-weight: 400; font-style: italic; letter-spacing: normal; line-height: normal; outline: none; }'
          if old not in text:
              raise SystemExit('Playlist detail search typography block not found')
          path.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/match-playlist-detail-search-typography.yml')
          workflow.unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'playlist-detail-search-input.*font-family: var(--font-aktiv-grotesk).*font-size: 12px.*font-weight: 400.*font-style: italic' 'apps/web/app/playlists/[playlistId]/page.tsx'
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Match playlist interior search typography"
          git push origin main
