name: Match search row button typography

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/match-search-row-button-typography.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match text buttons to header typography
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          shared = Path('packages/shared/styles/music-library-redesign.css')
          text = shared.read_text()
          old = '''  font-family: inherit;\n  font-size: 13px;\n  font-weight: 400;\n  cursor: pointer;'''
          new = '''  font-family: var(--font-aktiv-grotesk);\n  font-size: 12.5px;\n  font-weight: 400;\n  letter-spacing: normal;\n  line-height: normal;\n  cursor: pointer;'''
          if old not in text:
              raise SystemExit('Shared toolbar typography block not found')
          shared.write_text(text.replace(old, new, 1))

          playlists = Path('apps/web/app/playlists/playlists-tabs-rail.css')
          text = playlists.read_text()
          text = text.replace('''  font-size: 12px !important;\n  font-weight: 500 !important;\n}''', '''  font-family: var(--font-aktiv-grotesk) !important;\n  font-size: 12.5px !important;\n  font-weight: 400 !important;\n  letter-spacing: normal !important;\n  line-height: normal !important;\n}''', 1)
          text = text.replace('''  font-family: inherit !important;\n  font-size: 12px !important;\n  font-weight: 500 !important;\n  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease !important;''', '''  font-family: var(--font-aktiv-grotesk) !important;\n  font-size: 12.5px !important;\n  font-weight: 400 !important;\n  letter-spacing: normal !important;\n  line-height: normal !important;\n  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease !important;''', 1)
          text = text.replace('''  font-family: inherit !important;\n  font-size: 12px !important;\n  font-weight: 500 !important;\n  transition: opacity 0.15s ease !important;''', '''  font-family: var(--font-aktiv-grotesk) !important;\n  font-size: 12.5px !important;\n  font-weight: 400 !important;\n  letter-spacing: normal !important;\n  line-height: normal !important;\n  transition: opacity 0.15s ease !important;''', 1)
          playlists.write_text(text)

          projects = Path('apps/web/app/projects/page.tsx')
          text = projects.read_text()
          replacements = {
              'font-family: inherit; font-size: 12px; font-weight: 500; transition: background': 'font-family: var(--font-aktiv-grotesk); font-size: 12.5px; font-weight: 400; letter-spacing: normal; line-height: normal; transition: background',
              'font-family: inherit; font-size: 12px; font-weight: 500; transition: opacity': 'font-family: var(--font-aktiv-grotesk); font-size: 12.5px; font-weight: 400; letter-spacing: normal; line-height: normal; transition: opacity',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Projects typography block not found: {old}')
              text = text.replace(old, new)
          projects.write_text(text)

          workflow = Path('.github/workflows/match-search-row-button-typography.yml')
          workflow.unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'font-size: 12.5px' packages/shared/styles/music-library-redesign.css
          grep -q 'font-family: var(--font-aktiv-grotesk)' apps/web/app/playlists/playlists-tabs-rail.css
          grep -q 'projects-new-button.*font-size: 12.5px' apps/web/app/projects/page.tsx
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Match search row buttons to header font"
          git push origin main
