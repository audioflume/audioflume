name: Apply Discover light header and surface

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-discover-light-header-and-surface.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Discover light mode styling
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence for {label}, found {count}")
              return content.replace(old, new, 1)

          header_path = Path("apps/web/components/Header.tsx")
          header = header_path.read_text()

          header = replace_once(
              header,
              '''  const headerClassName = [
    "filmwave-web-header",
    transparentAtTop ? "supports-transparent-header" : "",
    headerIsSolid ? "is-solid" : "is-transparent",
  ]''',
              '''  const headerClassName = [
    "filmwave-web-header",
    pathname === "/discover" ? "is-discover-route" : "",
    transparentAtTop ? "supports-transparent-header" : "",
    headerIsSolid ? "is-solid" : "is-transparent",
  ]''',
              "Discover header route class",
          )

          header = replace_once(
              header,
              '''        .filmwave-web-header.is-solid {
          --filmwave-chrome-surface: var(--bg-primary);''',
              '''        .filmwave-web-header.is-solid,
        :where(html.light, html[data-theme="light"])
          .filmwave-web-header.is-discover-route.is-transparent {
          --filmwave-chrome-surface: var(--bg-primary);''',
              "solid header surface selector",
          )

          header = replace_once(
              header,
              '''        .filmwave-web-header.is-solid .filmwave-header-tonal-wordmark,
        .filmwave-web-header.is-solid .filmwave-header-logo-action,
        .filmwave-web-header.is-solid .filmwave-header-actions {
          color: var(--text-primary) !important;
        }''',
              '''        .filmwave-web-header.is-solid .filmwave-header-tonal-wordmark,
        .filmwave-web-header.is-solid .filmwave-header-logo-action,
        .filmwave-web-header.is-solid .filmwave-header-actions,
        :where(html.light, html[data-theme="light"])
          .filmwave-web-header.is-discover-route.is-transparent
          .filmwave-header-tonal-wordmark,
        :where(html.light, html[data-theme="light"])
          .filmwave-web-header.is-discover-route.is-transparent
          .filmwave-header-logo-action,
        :where(html.light, html[data-theme="light"])
          .filmwave-web-header.is-discover-route.is-transparent
          .filmwave-header-actions {
          color: var(--text-primary) !important;
        }''',
              "solid header logo colors",
          )

          header = replace_once(
              header,
              '''        .filmwave-web-header.is-solid .filmwave-header-nav-link {
          color: var(--text-secondary) !important;
        }''',
              '''        .filmwave-web-header.is-solid .filmwave-header-nav-link,
        :where(html.light, html[data-theme="light"])
          .filmwave-web-header.is-discover-route.is-transparent
          .filmwave-header-nav-link {
          color: var(--text-secondary) !important;
        }''',
              "solid header nav colors",
          )

          header = replace_once(
              header,
              '''        .filmwave-web-header.is-solid .filmwave-header-nav-link:hover,
        .filmwave-web-header.is-solid .filmwave-header-nav-link.is-active {
          background: transparent !important;
          background-color: transparent !important;
          color: var(--text-primary) !important;
        }''',
              '''        .filmwave-web-header.is-solid .filmwave-header-nav-link:hover,
        .filmwave-web-header.is-solid .filmwave-header-nav-link.is-active,
        :where(html.light, html[data-theme="light"])
          .filmwave-web-header.is-discover-route.is-transparent
          .filmwave-header-nav-link:hover,
        :where(html.light, html[data-theme="light"])
          .filmwave-web-header.is-discover-route.is-transparent
          .filmwave-header-nav-link.is-active {
          background: transparent !important;
          background-color: transparent !important;
          color: var(--text-primary) !important;
        }''',
              "solid header active nav colors",
          )

          header_path.write_text(header)

          hero_path = Path("apps/web/app/discover/discover-curated-hero-copy.css")
          hero = hero_path.read_text()

          replacements = [
              (
                  '''  color: #111;
}''',
                  '''  color: var(--text-primary);
}''',
                  "light category controls text",
              ),
              (
                  '''  background: #f1f1f1;
  box-shadow: 0 18px 42px rgba(17, 17, 17, 0.06);''',
                  '''  background: var(--bg-hover-strong);
  box-shadow: none;''',
                  "light search surface",
              ),
              (
                  '''  color: #111;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search input::placeholder {''',
                  '''  color: var(--text-primary);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search input::placeholder {''',
                  "light search input text",
              ),
              (
                  '''  color: rgba(17, 17, 17, 0.48);''',
                  '''  color: var(--text-muted);''',
                  "light search placeholder",
              ),
              (
                  '''  background: #e4e4e4;
  color: rgba(17, 17, 17, 0.56);''',
                  '''  background: var(--bg-control-hover);
  color: var(--text-secondary);''',
                  "light search button",
              ),
              (
                  '''  background: #d8d8d8;
  color: #111;''',
                  '''  background: var(--icon-button-hover);
  color: var(--text-primary);''',
                  "light search button hover",
              ),
              (
                  '''  outline-color: rgba(17, 17, 17, 0.62);''',
                  '''  outline-color: var(--border-strong);''',
                  "light search focus",
              ),
              (
                  '''  color: #111;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-button {''',
                  '''  color: var(--text-primary);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-button {''',
                  "light category heading",
              ),
              (
                  '''  border-color: rgba(17, 17, 17, 0.2);
  color: rgba(17, 17, 17, 0.9);''',
                  '''  border-color: var(--border-strong);
  color: var(--text-primary);''',
                  "light filter controls",
              ),
              (
                  '''  border-color: rgba(17, 17, 17, 0.42);''',
                  '''  border-color: var(--border-hover);''',
                  "light filter control hover",
              ),
              (
                  '''  border-color: #111;
  background: #111;
  color: #fff;''',
                  '''  border-color: var(--text-primary);
  background: var(--text-primary);
  color: var(--bg-primary);''',
                  "light open filter control",
              ),
              (
                  '''  border-color: transparent;
  background: #eeeeee;
  color: rgba(17, 17, 17, 0.82);''',
                  '''  border-color: transparent;
  background: var(--bg-hover);
  color: var(--text-secondary);''',
                  "light filter pills",
              ),
              (
                  '''  border-color: rgba(17, 17, 17, 0.16);
  color: #111;''',
                  '''  border-color: var(--border-strong);
  color: var(--text-primary);''',
                  "light filter pill hover",
              ),
              (
                  '''  border-color: #111;
  background: #111;
  color: #fff;
}''',
                  '''  border-color: var(--text-primary);
  background: var(--text-primary);
  color: var(--bg-primary);
}''',
                  "light selected filter pill",
              ),
          ]

          for old, new, label in replacements:
              hero = replace_once(hero, old, new, label)

          hero_path.write_text(hero)

          last_path = Path("apps/web/app/discover/discover-hero-last-viewed.css")
          last = last_path.read_text()

          last = replace_once(
              last,
              '''  background: #000;
}''',
              '''  background: transparent;
}''',
              "transparent Discover hero surface",
          )

          last = replace_once(
              last,
              ''':where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-template-shell.is-discover-route
  .discover-hero {
  background: #f7f7f7;
}

''',
              '''''',
              "remove light hero background",
          )

          last = replace_once(
              last,
              '''  color: #111;
}''',
              '''  color: var(--text-primary);
}''',
              "light Last Viewed heading",
          )

          last = replace_once(
              last,
              '''  --bg-hover: rgba(17, 17, 17, 0.055);
  --bg-elevated: rgba(17, 17, 17, 0.1);
  --text-primary: #111;
  --text-muted: rgba(17, 17, 17, 0.45);''',
              '''  --bg-hover: var(--bg-hover-strong);
  --bg-elevated: var(--bg-control);
  --text-primary: #111111;
  --text-muted: rgba(17, 17, 17, 0.42);''',
              "light Last Viewed cards",
          )

          last_path.write_text(last)
          PY

      - name: Commit source changes and remove workflow
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "filmwave-webmaster@users.noreply.github.com"
          git rm .github/workflows/apply-discover-light-header-and-surface.yml
          git add apps/web/components/Header.tsx
          git add apps/web/app/discover/discover-curated-hero-copy.css
          git add apps/web/app/discover/discover-hero-last-viewed.css
          git commit -m "Refine Discover light mode header and surfaces"
          git push origin main
