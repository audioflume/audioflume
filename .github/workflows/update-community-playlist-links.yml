name: Update community playlist links

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-community-playlist-links.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update category and content links
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/community-playlists/page.tsx')
          text = path.read_text()

          old_categories = '''const categories = [
  "Documentary",
  "Travel",
  "Sports",
  "Ambient",
  "Western",
  "Urban",
  "Drama",
];'''
          new_categories = '''const categories = [
  "Documentary",
  "Travel",
  "Ambient",
  "Cinematic",
  "Urban",
  "Commercial",
  "Background",
];'''
          if old_categories not in text:
              raise SystemExit('Expected category list not found')
          text = text.replace(old_categories, new_categories, 1)

          old_tabs = '["Trending", "Recent", "Most Liked", "Staff Picks", "Favorites"]'
          new_tabs = '["Trending", "Recent", "Most Liked", "Favorites"]'
          if old_tabs not in text:
              raise SystemExit('Expected community tab list not found')
          text = text.replace(old_tabs, new_tabs, 1)

          path.write_text(text)
          Path('.github/workflows/update-community-playlist-links.yml').unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q '"Cinematic"' apps/web/app/community-playlists/page.tsx
          grep -q '"Commercial"' apps/web/app/community-playlists/page.tsx
          grep -q '"Background"' apps/web/app/community-playlists/page.tsx
          ! grep -q '"Staff Picks"' apps/web/app/community-playlists/page.tsx
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update community playlist links"
          git push origin main
