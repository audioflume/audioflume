name: Temporary artist public sliding shelves

on:
  push:
    branches:
      - feature/artist-public-sliding-shelves
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/artist-public-sliding-shelves
      - name: Convert artist release and playlist grids to shelves
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/components/artists/PublicArtistPageView.tsx')
          text = path.read_text()

          old_import = '''import Footer from "@/components/Footer";
          import ArtistFeaturePlayControl from "@/components/artists/ArtistFeaturePlayControl";
          import PublicArtistMusic from "@/components/artists/PublicArtistMusic";'''.replace('          ', '')
          new_import = '''import Footer from "@/components/Footer";
          import ArtistFeaturePlayControl from "@/components/artists/ArtistFeaturePlayControl";
          import PublicArtistCardShelf from "@/components/artists/PublicArtistCardShelf";
          import PublicArtistMusic from "@/components/artists/PublicArtistMusic";'''.replace('          ', '')
          if text.count(old_import) != 1:
              raise SystemExit('artist shelf import anchor mismatch')
          text = text.replace(old_import, new_import)

          old_releases = '''          {releases.length > 0 ? (
            <section className="artist-public-section">
              <div className="artist-public-section-header">
                <h2 className="artist-public-section-title">Releases</h2>
                <span className="artist-public-section-count">
                  {releases.length} {releases.length === 1 ? "release" : "releases"}
                </span>
              </div>
              <div className="artist-public-grid">
                {releases.map((release) => (
                  <ReleaseCard key={release.id} release={release} />
                ))}
              </div>
            </section>
          ) : null}'''
          new_releases = '''          {releases.length > 0 ? (
            <PublicArtistCardShelf
              title="Releases"
              countLabel={`${releases.length} ${
                releases.length === 1 ? "release" : "releases"
              }`}
            >
              {releases.map((release) => (
                <ReleaseCard key={release.id} release={release} />
              ))}
            </PublicArtistCardShelf>
          ) : null}'''
          if text.count(old_releases) != 1:
              raise SystemExit('releases section anchor mismatch')
          text = text.replace(old_releases, new_releases)

          old_playlists = '''          {playlists.length > 0 ? (
            <section className="artist-public-section">
              <div className="artist-public-section-header">
                <h2 className="artist-public-section-title">Playlists</h2>
                <span className="artist-public-section-count">
                  {playlists.length} {playlists.length === 1 ? "playlist" : "playlists"}
                </span>
              </div>
              <div className="artist-public-grid">
                {playlists.map((playlist) => (
                  <PlaylistCard key={playlist.id} playlist={playlist} />
                ))}
              </div>
            </section>
          ) : null}'''
          new_playlists = '''          {playlists.length > 0 ? (
            <PublicArtistCardShelf
              title="Playlists"
              countLabel={`${playlists.length} ${
                playlists.length === 1 ? "playlist" : "playlists"
              }`}
            >
              {playlists.map((playlist) => (
                <PlaylistCard key={playlist.id} playlist={playlist} />
              ))}
            </PublicArtistCardShelf>
          ) : null}'''
          if text.count(old_playlists) != 1:
              raise SystemExit('playlists section anchor mismatch')
          text = text.replace(old_playlists, new_playlists)

          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/artists/PublicArtistPageView.tsx
          git commit -m "Make public artist releases and playlists sliding shelves"
          git push origin HEAD:feature/artist-public-sliding-shelves
