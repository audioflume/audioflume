name: Apply Discover moods curated gap

on:
  push:
    paths:
      - .github/workflows/apply-discover-moods-curated-gap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten Discover section gap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/discover/discover-page.css")
          content = path.read_text()
          old = "  margin-top: clamp(96px, 9vw, 144px) !important;"
          new = "  margin-top: clamp(64px, 6vw, 96px) !important;"

          if content.count(old) != 1:
              raise SystemExit("Expected Discover moods-to-curated gap exactly once")

          path.write_text(content.replace(old, new))
          PY

      - name: Commit source change and remove temporary workflow
        run: |
          rm .github/workflows/apply-discover-moods-curated-gap.yml
          git config user.name "filmwave-webmaster"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/discover/discover-page.css .github/workflows/apply-discover-moods-curated-gap.yml
          git commit -m "Tighten Discover moods to curated spacing"
          git push
