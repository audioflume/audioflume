name: Temporary artist overview hero redesign

on:
  push:
    branches:
      - style/artist-overview-admin-hero

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/artist-overview-admin-hero
      - name: Redesign artist overview hero
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/components/artists/ArtistOverview.tsx')
          text = path.read_text()

          old_wrapper = '''          <div className="relative h-[240px] select-none overflow-hidden bg-[var(--bg-tertiary)] md:h-[320px]">'''
          new_wrapper = '''          <div className="relative min-h-[355px] select-none overflow-hidden bg-[var(--bg-tertiary)]">'''
          if text.count(old_wrapper) != 1:
              raise SystemExit('hero wrapper anchor mismatch')
          text = text.replace(old_wrapper, new_wrapper)

          image_anchor = '''            <img
              ref={heroImageRef}
              src={artist.hero_image_url}
              alt={`${artist.name} hero`}
              draggable={false}
              className="pointer-events-none h-full w-full object-cover"
              style={{
                objectPosition: `${displayedHeroPosition.x}% ${displayedHeroPosition.y}%`,
              }}
            />
'''
          image_replacement = '''            <img
              ref={heroImageRef}
              src={artist.hero_image_url}
              alt={`${artist.name} hero`}
              draggable={false}
              className="pointer-events-none absolute inset-0 h-full w-full object-cover"
              style={{
                objectPosition: `${displayedHeroPosition.x}% ${displayedHeroPosition.y}%`,
              }}
            />

            {!cropEditing ? (
              <>
                <div className="pointer-events-none absolute inset-0 bg-gradient-to-r from-black/82 via-black/46 to-black/10" />
                <div className="pointer-events-none relative z-[2] flex min-h-[355px] flex-col justify-between p-5 md:p-6">
                  <div className="inline-flex w-fit max-w-full items-center gap-2 rounded-full border border-white/15 bg-white/10 px-3 py-1 text-[11px] font-medium leading-none text-white/75 backdrop-blur">
                    <span
                      className="h-1.5 w-1.5 shrink-0 rounded-full"
                      style={{
                        backgroundColor:
                          artist.status === "approved"
                            ? "var(--status-success, #48b571)"
                            : artist.status === "rejected" ||
                                artist.status === "suspended"
                              ? "var(--status-error, #dc584f)"
                              : "var(--status-warning, #d9a441)",
                      }}
                    />
                    <span className="truncate">{formatStatus(artist.status)}</span>
                  </div>

                  <div>
                    <div className="mb-4 flex items-end justify-between gap-5">
                      <div className="min-w-0">
                        <div className="truncate font-[family-name:var(--font-aktiv-grotesk)] text-[24px] font-medium tracking-[-0.04em] text-white">
                          {artist.name}
                        </div>
                        {artist.designation ? (
                          <div className="mt-1 text-[11px] text-white/60">
                            {artist.designation}
                          </div>
                        ) : null}
                      </div>
                      <Link
                        href={getArtistDashboardHref("my-page", artist.id)}
                        className="pointer-events-auto shrink-0 rounded-full border border-white/15 bg-white/10 px-3 py-2 text-[11px] font-medium text-white/80 backdrop-blur transition-colors hover:bg-white/15 hover:text-white"
                      >
                        View my page
                      </Link>
                    </div>

                    <div className="grid gap-2 sm:grid-cols-3">
                      <div className="rounded-full border border-white/15 bg-white/10 px-3 py-2 text-[11px] font-medium text-white/80 backdrop-blur">
                        {formatNumber(artist.stats.tracks)} approved tracks
                      </div>
                      <div className="rounded-full border border-white/15 bg-white/10 px-3 py-2 text-[11px] font-medium text-white/80 backdrop-blur">
                        {formatNumber(artist.stats.releases)} releases
                      </div>
                      <div className="rounded-full border border-white/15 bg-white/10 px-3 py-2 text-[11px] font-medium text-white/80 backdrop-blur">
                        {formatNumber(artist.stats.playlists)} playlists
                      </div>
                    </div>
                  </div>
                </div>
              </>
            ) : null}
'''
          if text.count(image_anchor) != 1:
              raise SystemExit('hero image anchor mismatch')
          text = text.replace(image_anchor, image_replacement)

          old_identity = '''
          <div className="flex items-center justify-between gap-5 px-5 py-4">
            <div className="min-w-0">
              <div className="truncate font-[family-name:var(--font-aktiv-grotesk)] text-[18px] font-medium tracking-[-0.03em] text-[var(--text-primary)]">
                {artist.name}
              </div>
              {artist.designation ? (
                <div className="mt-1 text-[11px] text-[var(--text-muted)]">
                  {artist.designation}
                </div>
              ) : null}
            </div>
            <Link
              href={getArtistDashboardHref("my-page", artist.id)}
              className="filmwave-backend-button shrink-0"
            >
              View my page
            </Link>
          </div>
'''
          if text.count(old_identity) != 1:
              raise SystemExit('old artist identity strip anchor mismatch')
          text = text.replace(old_identity, '\n')

          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/artists/ArtistOverview.tsx
          git commit -m "Redesign artist overview hero"
          git push origin HEAD:style/artist-overview-admin-hero
