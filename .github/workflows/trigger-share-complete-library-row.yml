name: Trigger complete library row source update

on:
  push:
    branches: [main]
    paths:
      - .github/trigger-share-complete-library-row

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          printf '\n# Triggered source update\n' >> .github/workflows/share-complete-library-row.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/share-complete-library-row.yml
          git commit -m "Run shared complete library row update"
          git push origin main
