name: Fix Discover mood shelf end inset

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-discover-mood-end-inset.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Match mood shelf end inset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/discover/discover-page.css")
          css = path.read_text()

          old = '''body:has(.discover-page-root)
            .discover-mood-section
            .curated-playlist-shelf-scroller {
            gap: 12px;
            padding-right: 0 !important;
            padding-left: max(
              var(--discover-editorial-gutter),
              calc((100vw - var(--discover-editorial-width)) / 2)
            ) !important;
            scroll-padding-left: max(
              var(--discover-editorial-gutter),
              calc((100vw - var(--discover-editorial-width)) / 2)
            );
          }
          '''

          new = '''body:has(.discover-page-root)
            .discover-mood-section
            .curated-playlist-shelf-scroller {
            gap: 12px;
            padding-right: max(
              var(--discover-editorial-gutter),
              calc((100vw - var(--discover-editorial-width)) / 2)
            ) !important;
            padding-left: max(
              var(--discover-editorial-gutter),
              calc((100vw - var(--discover-editorial-width)) / 2)
            ) !important;
            scroll-padding-right: max(
              var(--discover-editorial-gutter),
              calc((100vw - var(--discover-editorial-width)) / 2)
            );
            scroll-padding-left: max(
              var(--discover-editorial-gutter),
              calc((100vw - var(--discover-editorial-width)) / 2)
            );
          }
          '''

          if css.count(old) != 1:
              raise SystemExit("Expected Discover mood scroller inset rule exactly once")

          path.write_text(css.replace(old, new, 1))
          PY

      - name: Commit source fix and remove workflow
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-discover-mood-end-inset.yml
          git add apps/web/app/discover/discover-page.css .github/workflows/fix-discover-mood-end-inset.yml
          git commit -m "Match Discover mood shelf end inset"
          git push origin main
