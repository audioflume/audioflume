name: Fix Zalando threshold edge cases

on:
  push:
    branches:
      - style/zalando-weight-rules-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct audited threshold edge cases
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(pathname, old, new, count=None):
              path = Path(pathname)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected pattern in {pathname}: {old}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              path.write_text(text)

          replace(
              'packages/shared/styles/app-chrome.css',
              '  --filmwave-filter-trigger-font-size: 13px;\n  font-weight: 320;\n  --filmwave-filter-menu-radius: 12px;',
              '  --filmwave-filter-trigger-font-size: 13px;\n  --filmwave-filter-menu-radius: 12px;',
              1,
          )

          replace(
              'apps/web/app/curated-playlists/curated-playlists.css',
              '''.curated-feature-hero-title-block h1 {\n  margin: 9px 0 0;\n  color: #fff;\n  font-family: var(--font-zalando-sans), sans-serif;\n  font-size: clamp(30px, 3.2vw, 48px);\n  font-weight: 200;''',
              '''.curated-feature-hero-title-block h1 {\n  margin: 9px 0 0;\n  color: #fff;\n  font-family: var(--font-zalando-sans), sans-serif;\n  font-size: clamp(30px, 3.2vw, 48px);\n  font-weight: 400;''',
              1,
          )
          replace(
              'apps/web/app/curated-playlists/curated-playlists.css',
              '''  .curated-feature-hero-title-block h1 {\n    font-size: clamp(30px, 8vw, 42px);\n    font-weight: 200;\n  }''',
              '''  .curated-feature-hero-title-block h1 {\n    font-size: clamp(30px, 8vw, 42px);\n    font-weight: 400;\n  }''',
              1,
          )

          replace(
              'apps/web/app/discover/discover-page.css',
              '''.discover-artist-feature-overlay h3 {\n  margin: 0;\n  font-size: clamp(29px, 2.65vw, 44px);\n  font-weight: 200;''',
              '''.discover-artist-feature-overlay h3 {\n  margin: 0;\n  font-size: clamp(29px, 2.65vw, 44px);\n  font-weight: 400;''',
              1,
          )

          replace(
              'packages/shared/styles/playlist-library.css',
              '''  font-size: 44px !important;\n  font-weight: 400 !important;\n  color: rgba(255, 255, 255, 0.2) !important;''',
              '''  font-size: 44px !important;\n  font-weight: 200 !important;\n  color: rgba(255, 255, 255, 0.2) !important;''',
              1,
          )
          PY

      - name: Run style guard
        run: npm run style:guard

      - name: Check diff whitespace
        run: git diff --check

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-zalando-threshold-edge-cases.yml

      - name: Commit edge-case fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Zalando threshold edge cases"
          git push origin HEAD:style/zalando-weight-rules-v2
