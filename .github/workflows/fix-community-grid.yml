name: Apply Community sidebar grid fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-community-grid.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Correct Community page grid declaration
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/community-playlists/page.tsx")
          source = path.read_text()
          old = "grid-template-columns: 276px minmax(0, 1fr){"
          new = "grid-template-columns: 276px minmax(0, 1fr);"
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY

      - name: Commit source fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-community-grid.yml
          git add apps/web/app/community-playlists/page.tsx
          git commit -m "Restore Community playlist sidebar layout"
          git push origin HEAD:main
