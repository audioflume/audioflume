name: Fix project archive callback

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-project-archive-callback.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect archive callback
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/projects/page.tsx')
          text = path.read_text()

          old = '''                  onDeleteProject={(targetProject) => {
                    void handleDeleteProject(targetProject);
                  }}
                  onToast={showToast}
'''
          new = '''                  onDeleteProject={(targetProject) => {
                    void handleDeleteProject(targetProject);
                  }}
                  onToggleArchive={(targetProject) => {
                    void handleToggleArchive(targetProject);
                  }}
'''

          if old not in text:
              raise SystemExit('Expected ProjectRow prop block not found')

          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-project-archive-callback.yml').unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'onToggleArchive={(targetProject)' apps/web/app/projects/page.tsx
          ! grep -q 'onToast={showToast}' apps/web/app/projects/page.tsx
          npm run style:guard
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix project archive callback"
          git push origin main
