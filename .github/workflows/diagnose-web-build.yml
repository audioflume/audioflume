name: Diagnose web build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-web-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web build and capture output
        shell: bash
        run: |
          set +e
          npm --prefix apps/web run build > web-build-output.txt 2>&1
          status=$?
          echo "$status" > web-build-status.txt
          cat web-build-output.txt
          exit 0

      - name: Commit diagnostic output
        shell: bash
        run: |
          rm .github/workflows/diagnose-web-build.yml
          git config user.name "filmwave-webmaster"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Capture web build diagnostic"
          git push origin main
