name: Temporary artist hero discover overlay

on:
  push:
    branches:
      - style/artist-hero-discover-overlay

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/artist-hero-discover-overlay
      - name: Match Discover hero overlay
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/components/artists/ArtistOverview.tsx')
          text = path.read_text()
          old = '''                <div className="pointer-events-none absolute inset-0 bg-gradient-to-r from-black/82 via-black/46 to-black/10" />'''
          new = '''                <div
                  className="pointer-events-none absolute inset-0"
                  style={{
                    background:
                      "linear-gradient(rgba(13, 13, 13, 0.2), rgba(13, 13, 13, 0.2)), linear-gradient(180deg, rgba(0, 0, 0, 0.115) 0%, rgba(0, 0, 0, 0.03) 46%, rgba(0, 0, 0, 0.06) 64%, transparent 80%)",
                  }}
                />'''
          if text.count(old) != 1:
              raise SystemExit('overlay anchor mismatch')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/artists/ArtistOverview.tsx
          git commit -m "Match artist hero overlay to Discover"
          git push origin HEAD:style/artist-hero-discover-overlay
