name: Apply Discover hero spacing and light theme

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-discover-hero-theme-spacing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Discover hero styling
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(content, old, new, label):
              if old not in content:
                  raise SystemExit(f"Missing source for {label}")
              return content.replace(old, new, 1)

          hero_path = Path("apps/web/app/discover/discover-curated-hero-copy.css")
          hero = hero_path.read_text()

          hero = replace_once(hero, "  height: 34px;\n  align-items: center;\n  justify-content: center;\n  gap: 9px;\n  padding: 0 15px;", "  height: 28px;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  padding: 0 13px;", "desktop dropdown pills")
          hero = replace_once(hero, "  min-height: 30px;\n  align-items: center;\n  justify-content: center;\n  padding: 5px 14px;", "  min-height: 26px;\n  align-items: center;\n  justify-content: center;\n  padding: 3px 12px;", "desktop filter pills")
          hero = replace_once(hero, "    height: 32px;\n    gap: 8px;\n    padding-right: 13px;\n    padding-left: 13px;", "    height: 28px;\n    gap: 7px;\n    padding-right: 12px;\n    padding-left: 12px;", "mobile dropdown pills")
          hero = replace_once(hero, "    min-height: 29px;\n    padding-right: 12px;\n    padding-left: 12px;", "    min-height: 26px;\n    padding-right: 11px;\n    padding-left: 11px;", "mobile filter pills")

          light_theme = ''':where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-hero-controls {
  color: #111;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search {
  background: #f1f1f1;
  box-shadow: 0 18px 42px rgba(17, 17, 17, 0.06);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search input {
  color: #111;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search input::placeholder {
  color: rgba(17, 17, 17, 0.48);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search button {
  background: #e4e4e4;
  color: rgba(17, 17, 17, 0.56);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search button:hover,
:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search button:focus-visible {
  background: #d8d8d8;
  color: #111;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-search button:focus-visible {
  outline-color: rgba(17, 17, 17, 0.62);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-browser h2 {
  color: #111;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-button {
  border-color: rgba(17, 17, 17, 0.2);
  color: rgba(17, 17, 17, 0.9);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-button:hover,
:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-button:focus-visible,
:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-button.has-selection {
  border-color: rgba(17, 17, 17, 0.42);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-button.is-open {
  border-color: #111;
  background: #111;
  color: #fff;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-pill {
  border-color: transparent;
  background: #eeeeee;
  color: rgba(17, 17, 17, 0.82);
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-pill:hover,
:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-pill:focus-visible {
  border-color: rgba(17, 17, 17, 0.16);
  color: #111;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-category-filter-pill.is-selected {
  border-color: #111;
  background: #111;
  color: #fff;
}

'''

          marker = "@media (max-width: 980px) {"
          if light_theme not in hero:
              hero = replace_once(hero, marker, light_theme + marker, "light theme insertion")
          hero_path.write_text(hero)

          last_path = Path("apps/web/app/discover/discover-hero-last-viewed.css")
          last = last_path.read_text()

          pairs = [
              ("clamp(540px, 56svh, 620px)", "clamp(500px, 52svh, 580px)", "closed hero"),
              ("540px,\n    calc(56svh - var(--filmwave-player-height, 72px)),\n    620px", "500px,\n    calc(52svh - var(--filmwave-player-height, 72px)),\n    580px", "closed player hero"),
              ("clamp(690px, 72svh, 780px)", "clamp(650px, 68svh, 740px)", "open hero"),
              ("690px,\n    calc(72svh - var(--filmwave-player-height, 72px)),\n    780px", "650px,\n    calc(68svh - var(--filmwave-player-height, 72px)),\n    740px", "open player hero"),
              ("clamp(24px, 3vw, 40px)", "clamp(12px, 1.5vw, 20px)", "Last Viewed bottom spacing"),
              ("width: min(100%, 1760px);", "width: min(100%, var(--discover-editorial-width));", "Last Viewed width"),
              ("clamp(640px, 82svh, 760px)", "clamp(600px, 76svh, 720px)", "mobile closed hero"),
              ("640px,\n      calc(82svh - var(--filmwave-player-height, 72px)),\n      760px", "600px,\n      calc(76svh - var(--filmwave-player-height, 72px)),\n      720px", "mobile closed player hero"),
              ("clamp(760px, 92svh, 880px)", "clamp(720px, 86svh, 840px)", "mobile open hero"),
              ("760px,\n      calc(92svh - var(--filmwave-player-height, 72px)),\n      880px", "720px,\n      calc(86svh - var(--filmwave-player-height, 72px)),\n      840px", "mobile open player hero"),
              ("padding-bottom: 24px;", "padding-bottom: 14px;", "mobile bottom spacing"),
          ]
          for old, new, label in pairs:
              last = replace_once(last, old, new, label)

          last_light = ''':where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-template-shell.is-discover-route
  .discover-hero {
  background: #f7f7f7;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-hero-last-viewed-heading h2 {
  color: #111;
}

:where(html.light, html[data-theme="light"])
  body:has(.discover-page-root)
  .discover-hero-last-viewed
  .recent-playlist-card-list.is-hero {
  --bg-hover: rgba(17, 17, 17, 0.055);
  --bg-elevated: rgba(17, 17, 17, 0.1);
  --text-primary: #111;
  --text-muted: rgba(17, 17, 17, 0.45);
}

'''
          marker = "@media (max-width: 620px) {"
          if last_light not in last:
              last = replace_once(last, marker, last_light + marker, "Last Viewed light theme insertion")
          last_path.write_text(last)
          PY

      - name: Commit source changes and remove workflow
        run: |
          git config user.name "filmwave-webmaster"
          git config user.email "filmwave-webmaster@users.noreply.github.com"
          git rm .github/workflows/apply-discover-hero-theme-spacing.yml
          git add apps/web/app/discover/discover-curated-hero-copy.css
          git add apps/web/app/discover/discover-hero-last-viewed.css
          git commit -m "Refine Discover hero spacing and light theme"
          git push origin main